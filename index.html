<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("cstd-alpha:theme");
          const preference = stored === "light" || stored === "dark" ? stored : "system";
          const resolved = preference === "system"
            ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : preference;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = resolved;
          document.querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", resolved === "dark" ? "#101513" : "#f2f3ef");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CSTD Alpha" />
    <meta name="description" content="CSTD Alpha — AI 驱动的私人公司深度研究工具。输入公司名即可生成质量评分（CQS）与投资吸引力评分（IAS）报告。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CSTD Alpha — AI 公司深度研究" />
    <meta property="og:description" content="AI 驱动的私人公司深度研究工具，生成质量评分与投资吸引力评分报告。" />
    <meta property="og:url" content="https://alpha.custard.top" />
    <title>CSTD Alpha — AI 公司深度研究</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
