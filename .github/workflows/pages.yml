name: Deploy Cloudflare Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck Functions
        run: npm run typecheck:functions

      - name: Build
        run: npm run build

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          timeout 180s npx wrangler d1 migrations apply cstd-alpha-report-library --remote
          ensure_assistant_bucket() {
            for attempt in 1 2 3; do
              echo "Cloudflare R2 bucket info attempt ${attempt}/3"
              bucket_list_log="$(mktemp)"
              if timeout 120s npx wrangler r2 bucket list > "$bucket_list_log" 2>&1 \
                && grep -qE '^name:[[:space:]]+cstd-alpha-report-library([[:space:]]*)$' "$bucket_list_log"; then
                cat "$bucket_list_log"
                rm -f "$bucket_list_log"
                return 0
              fi
              cat "$bucket_list_log"
              rm -f "$bucket_list_log"
              sleep $((attempt * 10))
            done

            echo "Cloudflare R2 bucket is missing; trying idempotent create"
            bucket_create_log="$(mktemp)"
            if timeout 120s npx wrangler r2 bucket create cstd-alpha-report-library > "$bucket_create_log" 2>&1; then
              cat "$bucket_create_log"
              rm -f "$bucket_create_log"
              return 0
            fi
            cat "$bucket_create_log"
            if grep -qiE "already exists|already taken" "$bucket_create_log"; then
              echo "Assistant R2 bucket already exists; continuing"
              rm -f "$bucket_create_log"
              return 0
            fi
            rm -f "$bucket_create_log"
            return 1
          }
          ensure_assistant_bucket
          ensure_assistant_queue() {
            for attempt in 1 2 3; do
              echo "Cloudflare queue info attempt ${attempt}/3"
              if timeout 120s npx wrangler queues info cstd-alpha-assistant-deep-research; then
                return 0
              fi
              sleep $((attempt * 10))
            done

            echo "Cloudflare queue info failed after retries; trying idempotent create"
            queue_create_log="$(mktemp)"
            if timeout 120s npm run queue:create:assistant > "$queue_create_log" 2>&1; then
              cat "$queue_create_log"
              rm -f "$queue_create_log"
              return 0
            fi
            cat "$queue_create_log"
            if grep -qi "already taken" "$queue_create_log"; then
              echo "Assistant queue already exists; continuing"
              rm -f "$queue_create_log"
              return 0
            fi
            rm -f "$queue_create_log"
            return 1
          }
          ensure_assistant_queue
          for attempt in 1 2 3; do
            echo "Cloudflare Worker deploy attempt ${attempt}/3"
            if timeout 240s npm run worker:deploy:assistant; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
          for attempt in 1 2 3; do
            echo "Cloudflare Pages deploy attempt ${attempt}/3"
            if timeout 240s npm run pages:deploy; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done
