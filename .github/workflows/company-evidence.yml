name: Build Company Evidence

on:
  schedule:
    - cron: "32 18 * * *"
  workflow_dispatch:
    inputs:
      user_id:
        description: "Optional user id"
        required: false
      watchlist_id:
        description: "Optional watchlist id"
        required: false

concurrency:
  group: company-evidence-${{ github.ref }}-${{ inputs.user_id || 'all-users' }}-${{ inputs.watchlist_id || 'all-watchlists' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPANY_EVIDENCE_REFRESH_URL: ${{ secrets.COMPANY_EVIDENCE_REFRESH_URL }}
      COMPANY_EVIDENCE_REFRESH_TOKEN: ${{ secrets.COMPANY_EVIDENCE_REFRESH_TOKEN }}
      COMPANY_EVIDENCE_USER_ID: ${{ inputs.user_id }}
      COMPANY_EVIDENCE_WATCHLIST_ID: ${{ inputs.watchlist_id }}
      COMPANY_EVIDENCE_LIMIT: 80
      COMPANY_EVIDENCE_BATCH_SIZE: 5
      COMPANY_EVIDENCE_REQUEST_TIMEOUT_MS: 90000
      COMPANY_EVIDENCE_MAX_RETRIES: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Refresh company evidence packages
        run: node scripts/refresh-company-evidence.mjs
