name: Build Radar Evidence

on:
  schedule:
    - cron: "12 */6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANYSEARCH_API_KEY: ${{ secrets.ANYSEARCH_API_KEY }}
      SEARXNG_ENDPOINTS: ${{ secrets.SEARXNG_ENDPOINTS }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      TUSHARE_BATCH_ENABLED: 1
      TUSHARE_BATCH_MAX_ROWS: 160
      TUSHARE_COMPANY_FALLBACK_ENABLED: 0
      TUSHARE_MAX_COMPANIES: 1
      RADAR_EVIDENCE_KV_NAMESPACE_ID: d2c77bf9e7f14258af33e2efd3f59c60
      RADAR_EVIDENCE_R2_BUCKET: ${{ secrets.RADAR_EVIDENCE_R2_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Python data packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install akshare baostock pandas lxml beautifulsoup4

      - name: Install Wrangler
        run: npm ci --ignore-scripts

      - name: Start optional local SearXNG
        run: |
          mkdir -p .searxng
          cat > .searxng/settings.yml <<'YAML'
          use_default_settings: true

          search:
            formats:
              - html
              - json

          server:
            secret_key: "cstd-alpha-radar-evidence"
            limiter: false
            image_proxy: false

          outgoing:
            request_timeout: 8.0
          YAML

          EXISTING_SEARXNG_ENDPOINTS="$(printf '%s' "$SEARXNG_ENDPOINTS" | tr '\r\n' ',,' | sed 's/,,*/,/g; s/^,//; s/,$//')"

          if ! timeout 90 docker pull searxng/searxng:latest; then
            echo "::warning::Could not pull searxng/searxng:latest from Docker Hub. Continuing with configured SEARXNG_ENDPOINTS only."
            if [ -n "$EXISTING_SEARXNG_ENDPOINTS" ]; then
              echo "SEARXNG_ENDPOINTS=$EXISTING_SEARXNG_ENDPOINTS" >> "$GITHUB_ENV"
            fi
            exit 0
          fi

          if ! docker run -d --name cstd-searxng \
            -p 8080:8080 \
            -v "${{ github.workspace }}/.searxng:/etc/searxng:ro" \
            searxng/searxng:latest; then
            echo "::warning::Could not start local SearXNG container. Continuing with configured SEARXNG_ENDPOINTS only."
            if [ -n "$EXISTING_SEARXNG_ENDPOINTS" ]; then
              echo "SEARXNG_ENDPOINTS=$EXISTING_SEARXNG_ENDPOINTS" >> "$GITHUB_ENV"
            fi
            exit 0
          fi

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then
              if [ -n "$EXISTING_SEARXNG_ENDPOINTS" ]; then
                echo "SEARXNG_ENDPOINTS=http://127.0.0.1:8080,$EXISTING_SEARXNG_ENDPOINTS" >> "$GITHUB_ENV"
              else
                echo "SEARXNG_ENDPOINTS=http://127.0.0.1:8080" >> "$GITHUB_ENV"
              fi
              exit 0
            fi
            sleep 2
          done

          docker logs cstd-searxng || true
          echo "::warning::Local SearXNG did not become ready. Continuing with configured SEARXNG_ENDPOINTS only."
          if [ -n "$EXISTING_SEARXNG_ENDPOINTS" ]; then
            echo "SEARXNG_ENDPOINTS=$EXISTING_SEARXNG_ENDPOINTS" >> "$GITHUB_ENV"
          fi

      - name: Collect evidence snapshot
        run: |
          python scripts/collect_radar_evidence.py \
            --output dist-radar/radar-evidence.json \
            --gzip-output dist-radar/radar-evidence.json.gz \
            --min-sources 36

      - name: Upload latest evidence to Workers KV
        run: |
          test -n "$RADAR_EVIDENCE_KV_NAMESPACE_ID"
          npx wrangler kv key put "radar-evidence:v1:latest" \
            --path dist-radar/radar-evidence.json \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote

      - name: Upload compressed evidence to R2
        if: env.RADAR_EVIDENCE_R2_BUCKET != ''
        run: |
          npx wrangler r2 object put "$RADAR_EVIDENCE_R2_BUCKET/radar/evidence/latest.json.gz" \
            --file dist-radar/radar-evidence.json.gz \
            --content-type application/json \
            --content-encoding gzip

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: radar-evidence
          retention-days: 3
          path: |
            dist-radar/radar-evidence.json
            dist-radar/radar-evidence.json.gz

      - name: Stop local SearXNG
        if: always()
        run: |
          docker rm -f cstd-searxng >/dev/null 2>&1 || true
