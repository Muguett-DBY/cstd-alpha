name: Analyze Radar Scan

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Radar analysis job id stored in Workers KV
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      RADAR_EVIDENCE_KV_NAMESPACE_ID: d2c77bf9e7f14258af33e2efd3f59c60
      RADAR_D1_DATABASE_NAME: cstd-alpha-report-library
      RADAR_JOB_ID: ${{ inputs.job_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate queued radar job
        id: validate_job
        run: |
          mkdir -p dist-radar
          npx wrangler kv key get "radar-analysis:job:${RADAR_JOB_ID}" \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote > dist-radar/job-current.json || true
          node <<'NODE'
          const fs = require("fs");
          const jobId = process.env.RADAR_JOB_ID;
          const raw = fs.existsSync("dist-radar/job-current.json")
            ? fs.readFileSync("dist-radar/job-current.json", "utf8").trim()
            : "";
          if (!raw || raw === "null") {
            throw new Error(`No queued radar job was found in KV for ${jobId}; refusing to run OpenCode Go DeepSeek.`);
          }
          let job;
          try {
            job = JSON.parse(raw);
          } catch (error) {
            throw new Error(`Queued radar job ${jobId} is not valid JSON; refusing to run OpenCode Go DeepSeek.`);
          }
          if (!job || job.id !== jobId) {
            throw new Error(`Radar job id mismatch for ${jobId}; refusing to run OpenCode Go DeepSeek.`);
          }
          if (!/^radar-\d+-[0-9a-f-]{8}$/i.test(job.id)) {
            throw new Error(`Radar job ${jobId} was not created by the website scan endpoint; refusing to run OpenCode Go DeepSeek.`);
          }
          if (job.status !== "queued") {
            throw new Error(`Radar job ${jobId} is ${job.status}, not queued; refusing to run OpenCode Go DeepSeek.`);
          }
          const updatedAt = Date.parse(job.updatedAt || "");
          if (!Number.isFinite(updatedAt) || Date.now() - updatedAt > 60 * 60 * 1000) {
            throw new Error(`Radar job ${jobId} is stale; refusing to run OpenCode Go DeepSeek.`);
          }
          console.log(`Validated queued website radar job ${jobId}.`);
          NODE

      - name: Mark radar job running
        run: |
          mkdir -p dist-radar
          node <<'NODE'
          const fs = require("fs");
          const now = new Date().toISOString();
          const current = JSON.parse(fs.readFileSync("dist-radar/job-current.json", "utf8"));
          const job = {
            ...current,
            status: "running",
            updatedAt: now,
            message: "后台深度分析运行中。"
          };
          fs.writeFileSync("dist-radar/job-running.json", JSON.stringify(job));
          NODE
          npx wrangler kv key put "radar-analysis:job:${RADAR_JOB_ID}" \
            --path dist-radar/job-running.json \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote
          npx wrangler kv key put "radar-analysis:job:latest" \
            --path dist-radar/job-running.json \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote

      - name: Download latest evidence and previous radar
        run: |
          npx wrangler kv key get "radar-evidence:v1:latest" \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote > dist-radar/radar-evidence.json
          npx wrangler kv key get "radar-scan:v2:latest" \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote > dist-radar/previous-radar-cache.json || echo "null" > dist-radar/previous-radar-cache.json

      - name: Run OpenCode Go DeepSeek radar analysis
        run: |
          node scripts/run_radar_analysis.mjs \
            --evidence dist-radar/radar-evidence.json \
            --previous dist-radar/previous-radar-cache.json \
            --job-id "$RADAR_JOB_ID" \
            --output-radar dist-radar/radar-cache.json \
            --output-job dist-radar/job-completed.json \
            --output-d1-sql dist-radar/radar-history.sql

      - name: Upload radar result to Workers KV
        run: |
          npx wrangler kv key put "radar-scan:v2:latest" \
            --path dist-radar/radar-cache.json \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote
          npx wrangler kv key put "radar-analysis:job:${RADAR_JOB_ID}" \
            --path dist-radar/job-completed.json \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote
          npx wrangler kv key put "radar-analysis:job:latest" \
            --path dist-radar/job-completed.json \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote

      - name: Upload structured radar history to D1
        continue-on-error: true
        run: |
          npx wrangler d1 execute "$RADAR_D1_DATABASE_NAME" \
            --remote \
            --file dist-radar/radar-history.sql

      - name: Mark radar job failed
        if: failure() && steps.validate_job.outcome == 'success'
        run: |
          mkdir -p dist-radar
          node <<'NODE'
          const fs = require("fs");
          const now = new Date().toISOString();
          const current = fs.existsSync("dist-radar/job-current.json")
            ? JSON.parse(fs.readFileSync("dist-radar/job-current.json", "utf8"))
            : { id: process.env.RADAR_JOB_ID, createdAt: now };
          const job = {
            ...current,
            status: "failed",
            updatedAt: now,
            message: "本次刷新失败，已保留上次扫描。"
          };
          fs.writeFileSync("dist-radar/job-failed.json", JSON.stringify(job));
          NODE
          npx wrangler kv key put "radar-analysis:job:${RADAR_JOB_ID}" \
            --path dist-radar/job-failed.json \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote || true
          npx wrangler kv key put "radar-analysis:job:latest" \
            --path dist-radar/job-failed.json \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote || true

      - name: Upload radar analysis artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radar-analysis-${{ inputs.job_id }}
          path: |
            dist-radar/radar-cache.json
            dist-radar/job-completed.json
            dist-radar/job-failed.json
            dist-radar/radar-evidence.json
            dist-radar/previous-radar-cache.json
            dist-radar/radar-history.sql
