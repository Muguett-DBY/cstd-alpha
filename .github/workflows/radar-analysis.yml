name: Analyze Radar Scan

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Radar analysis job id created by the website
        required: true
        type: string
      run_token:
        description: Unique token for this radar analysis attempt
        required: true
        type: string

concurrency:
  group: radar-analysis
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      RADAR_EVIDENCE_KV_NAMESPACE_ID: d2c77bf9e7f14258af33e2efd3f59c60
      RADAR_D1_DATABASE_NAME: cstd-alpha-report-library
      RADAR_ANALYSIS_WORKER_URL: ${{ secrets.RADAR_ANALYSIS_WORKER_URL }}
      RADAR_ANALYSIS_WORKER_TOKEN: ${{ secrets.RADAR_ANALYSIS_WORKER_TOKEN || secrets.TEMPLATE_ANALYSIS_WORKER_TOKEN }}
      RADAR_JOB_ID: ${{ inputs.job_id }}
      RADAR_ANALYSIS_RUN_TOKEN: ${{ inputs.run_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.CHECKOUT_PAT || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate job id and run token
        run: |
          node -e "const id=process.env.RADAR_JOB_ID||''; if(!/^radar-\d{10,16}-[0-9a-f]{8}$/i.test(id)){throw new Error('Invalid radar analysis job id')}"
          node -e "const token=process.env.RADAR_ANALYSIS_RUN_TOKEN||''; if(!/^[0-9a-f-]{36}$/i.test(token)){throw new Error('Invalid radar analysis run token')}"

      - name: Start current radar job
        id: start_job
        run: npx tsx scripts/radar-analysis-job-client.ts start

      - name: Download latest evidence and previous radar
        if: steps.start_job.outputs.current == 'true'
        run: |
          mkdir -p dist-radar
          npx wrangler kv key get "radar-evidence:v1:latest" \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote > dist-radar/radar-evidence.json
          npx wrangler kv key get "radar-scan:v2:latest" \
            --namespace-id "$RADAR_EVIDENCE_KV_NAMESPACE_ID" \
            --remote > dist-radar/previous-radar-cache.json || echo "null" > dist-radar/previous-radar-cache.json

      - name: Run DeepSeek radar analysis
        if: steps.start_job.outputs.current == 'true'
        run: |
          node scripts/run_radar_analysis.mjs \
            --evidence dist-radar/radar-evidence.json \
            --previous dist-radar/previous-radar-cache.json \
            --job-id "$RADAR_JOB_ID" \
            --output-radar dist-radar/radar-cache.json \
            --output-job dist-radar/job-completed.json \
            --output-d1-sql dist-radar/radar-history.sql

      - name: Publish current radar result
        id: publish_job
        if: steps.start_job.outputs.current == 'true'
        run: |
          npx tsx scripts/radar-analysis-job-client.ts complete \
            --radar dist-radar/radar-cache.json \
            --job dist-radar/job-completed.json

      - name: Upload structured radar history to D1
        if: steps.publish_job.outputs.published == 'true'
        continue-on-error: true
        run: |
          npx wrangler d1 execute "$RADAR_D1_DATABASE_NAME" \
            --remote \
            --file dist-radar/radar-history.sql

      - name: Mark current radar job failed
        if: failure() && steps.start_job.outcome == 'success' && steps.start_job.outputs.current == 'true'
        run: npx tsx scripts/radar-analysis-job-client.ts fail

      - name: Upload radar analysis artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radar-analysis-${{ inputs.job_id }}
          retention-days: 3
          path: |
            dist-radar/radar-cache.json
            dist-radar/job-completed.json
            dist-radar/radar-evidence.json
            dist-radar/previous-radar-cache.json
            dist-radar/radar-history.sql
